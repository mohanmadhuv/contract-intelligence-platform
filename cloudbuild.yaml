steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/contract-intelligence/app:$COMMIT_SHA', '.']

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/contract-intelligence/app:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'contract-intelligence'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/contract-intelligence/app:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,BQ_DATASET=contract_intelligence,GCP_REGION=northamerica-northeast1'

images:
  - 'northamerica-northeast1-docker.pkg.dev/$PROJECT_ID/contract-intelligence/app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
